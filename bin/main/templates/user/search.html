<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー検索</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        form { display: flex; gap: 8px; margin-top: 24px; }
        input[type="text"] { flex: 1; padding: 8px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 20px; font-size: 1rem; background: #4a90d9; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #357abd; }
        .error { margin-top: 16px; color: #c0392b; background: #fdecea; padding: 10px 14px; border-radius: 4px; }
        .hint { margin-top: 20px; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>ユーザー検索</h1>
    <!-- Bean Validationを使うためにth:actionでフォーム送信先を指定し、th:objectでフォームオブジェクトをバインド -->
    <!-- NOTE: #fields.hasErrors() は th:object のスコープ内（form内）でないと BindingResult が見つからずエラーになる -->
    <form th:action="@{/users}" th:object="${searchRequest}" method="get">
        <input type="text" th:field="*{userId}" placeholder="ユーザーIDを入力">
        <button type="submit">検索</button>
        <!-- Bean Validationのエラーメッセージ表示 -->
        <div th:if="${#fields.hasErrors('userId')}" class="error" th:errors="*{userId}"></div>
    </form>

    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <p class="hint">例: user001, user002, user003, alice, bob</p>

    <div style="margin-top: 24px;">
        <a th:href="@{/}" style="color: #4a90d9; text-decoration: none;">ホームへ戻る</a>
    </div>
</body>
</html>
